<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLSMC — Giriş</title>
<style>
:root{
  --bg:#0b1020; --panel:#121a2f; --line:#2a3657; --text:#eef3ff;
  --muted:#9eabc8; --accent:#5b8cff; --good:#38d39f; --danger:#ff6b7a;
  --shadow:0 16px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(91,140,255,.15), transparent 30%),
    radial-gradient(circle at 85% 10%, rgba(56,211,159,.10), transparent 25%),
    var(--bg);
}
button,input{font:inherit}
a{text-decoration:none}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{
  width:min(470px,100%);background:rgba(18,26,47,.96);border:1px solid var(--line);
  border-radius:24px;padding:32px;box-shadow:var(--shadow)
}

.login-logo-wrap{display:flex;justify-content:center;margin-bottom:18px}
.login-logo{
  width:108px;height:108px;object-fit:contain;border-radius:50%;
  box-shadow:0 10px 28px rgba(0,0,0,.22);
  background:#fff;padding:4px;border:1px solid rgba(255,255,255,.08)
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#785bff);font-size:22px;font-weight:800
}
.brand h1{font-size:20px;margin:0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:#c7d1ea;margin-bottom:7px}
input{
  width:100%;background:#0f162a;border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 13px;outline:none
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
.btn{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;transition:.18s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7b61ff);color:white}
.btn-secondary{background:#202b49;color:#dce6ff;border:1px solid #344264}
.btn-good{background:var(--good);color:#07140f}
.full{width:100%}
.flash{padding:13px 14px;border-radius:12px;margin-bottom:16px;font-weight:750;font-size:14px}
.flash.success{background:rgba(56,211,159,.13);border:1px solid rgba(56,211,159,.5);color:#8ff0ce}
.flash.error{background:rgba(255,107,122,.12);border:1px solid rgba(255,107,122,.45);color:#ffb5bd}
.example{
  margin-top:16px;padding:12px;border-radius:12px;background:#0f162a;
  border:1px dashed #344264;color:var(--muted);font-size:12px;line-height:1.6
}
.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}

.developer-credit{
  position:fixed;
  right:14px;
  bottom:10px;
  z-index:1000;
  color:var(--muted, #7A8891);
  font-size:11px;
  font-weight:600;
  letter-spacing:.2px;
  opacity:.78;
  user-select:none;
  pointer-events:none;
}
@media(max-width:600px){
  .developer-credit{
    right:10px;
    bottom:8px;
    font-size:10px;
  }
}

</style>
<script>
(function(){
  var selected = "dark";
  try{ selected = localStorage.getItem("clsmc-interface-theme") === "light" ? "light" : "dark"; }catch(error){}
  document.documentElement.dataset.theme = selected;
  document.documentElement.style.colorScheme = selected;
})();
</script>
<link id="clsmc-light-theme" rel="stylesheet" href="{{ url_for('static', filename='clsmc_theme.css') }}" media="not all">
<link rel="stylesheet" href="{{ url_for('static', filename='clsmc_theme_toggle.css') }}">
<script>
  document.getElementById("clsmc-light-theme").media = document.documentElement.dataset.theme === "light" ? "all" : "not all";
</script>
<script defer src="{{ url_for('static', filename='clsmc_theme_toggle.js') }}"></script>
</head>
<body>
<section class="auth-wrap">
  <div class="auth-card">
    <div class="login-logo-wrap">
      <img class="login-logo" src="{{ url_for('static', filename='clsmc_logo.png') }}" alt="Central Los Santos Medical Center logosu">
    </div>

    <div class="brand" style="justify-content:center;text-align:center;">
      <div>
        <h1>CLSMC Rapor Sistemi</h1>
        <p>Central Los Santos Medical Center</p>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="field">
        <label>Kullanıcı Adı</label>
        <input id="loginUsername" name="username" value="{{ prefill_username|default('') }}" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Şifre</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary full" type="submit">Giriş Yap</button>
    </form>

    <div class="example">
      Örnek:<br>
      <b>Kullanıcı Adı:</b> Darius Blackwell<br>
      <b>Şifre:</b> Darius123
    </div>
  </div>
</section>

<div class="developer-credit">Developer: Veyrath</div>

</body>
</html>
